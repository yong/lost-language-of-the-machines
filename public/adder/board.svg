<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Starlax's phone photo of the inside of the CATVENTURE cabinet: the score
       section of the board, and her red marker circle round the 7483.
       Real parts: 7408 (four AND gates), 7483 (4-bit adder), 7486 (four XOR
       gates), 7400, 7404, 7432, 7474, 74161, 74193 — the chips early arcade
       boards were made of, with no program anywhere. -->
  <defs>
    <radialGradient id="flash" cx="28%" cy="22%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21754d"/>
      <stop offset="1" stop-color="#175838"/>
    </linearGradient>
    <g id="pin14">
      <rect x="10" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="31" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="52" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="73" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="94" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="115" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="136" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="10" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="31" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="52" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="73" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="94" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="115" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="136" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="0" y="0" width="154" height="80" rx="4" fill="#151515"/>
      <rect x="0" y="0" width="154" height="10" rx="4" fill="#ffffff" opacity="0.06"/>
      <path d="M0 30 A10 10 0 0 1 0 50 Z" fill="#2c2c2c"/>
      <circle cx="16" cy="64" r="4" fill="#2c2c2c"/>
    </g>
    <g id="pin16">
      <rect x="9" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="30" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="51" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="72" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="93" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="114" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="135" y="-7" width="8" height="9" fill="#c9ccd1"/><rect x="156" y="-7" width="8" height="9" fill="#c9ccd1"/>
      <rect x="9" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="30" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="51" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="72" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="93" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="114" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="135" y="78" width="8" height="9" fill="#c9ccd1"/><rect x="156" y="78" width="8" height="9" fill="#c9ccd1"/>
      <rect x="0" y="0" width="174" height="80" rx="4" fill="#151515"/>
      <rect x="0" y="0" width="174" height="10" rx="4" fill="#ffffff" opacity="0.06"/>
      <path d="M0 30 A10 10 0 0 1 0 50 Z" fill="#2c2c2c"/>
      <circle cx="16" cy="64" r="4" fill="#2c2c2c"/>
    </g>
  </defs>

  <!-- the inside of the cabinet, around the board -->
  <rect width="800" height="600" fill="#140e0a"/>
  <rect x="0" y="0" width="800" height="26" fill="#3a2516"/>
  <rect x="0" y="574" width="800" height="26" fill="#2c1c11"/>

  <g transform="rotate(-2.5 400 300)">
    <rect x="34" y="40" width="732" height="522" rx="14" fill="url(#pcb)" stroke="#0f3f28" stroke-width="4"/>
    <!-- copper traces under the mask -->
    <g fill="none" stroke="#d9b45a" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
      <path d="M90 200 H700"/><path d="M90 385 H700"/><path d="M60 120 V520"/>
      <path d="M244 210 V240"/><path d="M466 210 V240"/><path d="M244 370 V400"/><path d="M640 370 V400"/>
      <path d="M720 90 V530"/><path d="M120 530 H700"/>
    </g>
    <circle cx="64" cy="70" r="10" fill="#0f3f28" stroke="#c9ccd1" stroke-width="3"/>
    <circle cx="736" cy="70" r="10" fill="#0f3f28" stroke="#c9ccd1" stroke-width="3"/>
    <circle cx="64" cy="532" r="10" fill="#0f3f28" stroke="#c9ccd1" stroke-width="3"/>
    <circle cx="736" cy="532" r="10" fill="#0f3f28" stroke="#c9ccd1" stroke-width="3"/>

    <!-- top row -->
    <use href="#pin16" x="86" y="100"/>
    <use href="#pin14" x="318" y="100"/>
    <use href="#pin14" x="530" y="100"/>
    <!-- the score section, boxed and labelled on the board itself -->
    <rect x="72" y="232" width="660" height="138" rx="8" fill="none" stroke="#f1f5f2" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="10 6"/>
    <text x="86" y="252" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#f1f5f2" fill-opacity="0.85" letter-spacing="3">SCORE</text>
    <use href="#pin14" x="96" y="268"/>
    <use href="#pin16" x="304" y="268"/>
    <use href="#pin14" x="548" y="268"/>
    <!-- bottom row -->
    <use href="#pin14" x="86" y="420"/>
    <use href="#pin16" x="304" y="420"/>
    <use href="#pin14" x="548" y="420"/>

    <!-- chip markings -->
    <g font-family="Arial, Helvetica, sans-serif" fill="#e6e6e6" text-anchor="middle">
      <text x="173" y="146" font-size="20" font-weight="700">SN74161N</text><text x="173" y="164" font-size="11" fill="#9a9a9a">7741</text>
      <text x="395" y="146" font-size="20" font-weight="700">SN7474N</text><text x="395" y="164" font-size="11" fill="#9a9a9a">7741</text>
      <text x="607" y="146" font-size="20" font-weight="700">SN7400N</text><text x="607" y="164" font-size="11" fill="#9a9a9a">7740</text>
      <text x="173" y="314" font-size="22" font-weight="700">SN7408N</text><text x="173" y="332" font-size="11" fill="#9a9a9a">7741</text>
      <text x="391" y="316" font-size="30" font-weight="700">SN7483N</text><text x="391" y="336" font-size="11" fill="#9a9a9a">7741</text>
      <text x="625" y="314" font-size="22" font-weight="700">SN7486N</text><text x="625" y="332" font-size="11" fill="#9a9a9a">7739</text>
      <text x="163" y="466" font-size="20" font-weight="700">SN7404N</text><text x="163" y="484" font-size="11" fill="#9a9a9a">7740</text>
      <text x="391" y="466" font-size="20" font-weight="700">SN74193N</text><text x="391" y="484" font-size="11" fill="#9a9a9a">7741</text>
      <text x="625" y="466" font-size="20" font-weight="700">SN7432N</text><text x="625" y="484" font-size="11" fill="#9a9a9a">7741</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f1f5f2" fill-opacity="0.7">
      <text x="86" y="92">U1</text><text x="318" y="92">U2</text><text x="530" y="92">U3</text>
      <text x="96" y="388">U4</text><text x="304" y="388">U5</text><text x="548" y="388">U6</text>
      <text x="86" y="412">U7</text><text x="304" y="412">U8</text><text x="548" y="412">U9</text>
    </g>
    <!-- a couple of capacitors -->
    <circle cx="742" cy="160" r="0" fill="none"/>
    <g>
      <circle cx="280" cy="210" r="13" fill="#1e40af"/><circle cx="280" cy="210" r="13" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <rect x="506" y="200" width="22" height="12" rx="3" fill="#c2924a"/>
    </g>
  </g>

  <!-- Starlax's red marker -->
  <g fill="none" stroke="#ef233c" stroke-linecap="round">
    <ellipse cx="392" cy="311" rx="128" ry="74" stroke-width="7" transform="rotate(-6 392 311)"/>
    <ellipse cx="396" cy="309" rx="122" ry="70" stroke-width="3" transform="rotate(-3 396 309)" stroke-opacity="0.7"/>
    <path d="M610 520 Q560 470 500 392" stroke-width="6"/>
    <path d="M500 392 L522 400 M500 392 L506 414" stroke-width="6"/>
  </g>
  <text x="612" y="548" font-family="'Comic Sans MS', 'Marker Felt', cursive" font-weight="700" font-size="34" fill="#ef233c">this one!!</text>

  <!-- the phone's flash, and the dark corners of a photo taken in a cabinet -->
  <rect width="800" height="600" fill="url(#flash)"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
