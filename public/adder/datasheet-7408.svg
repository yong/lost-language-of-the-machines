<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740">
  <!-- Flamey's reply: the data sheet for the 7408 — the real pin layout of the
       real chip (pins 1,2→3; 4,5→6; 9,10→8; 12,13→11; 7 GND; 14 VCC) and its
       function table. Four AND doors inside one little black chip. -->
  <rect width="600" height="740" fill="#e9e6dd"/>
  <rect x="18" y="14" width="564" height="712" fill="#fbfaf6" stroke="#d6d2c4" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2328">
    <text x="44" y="70" font-size="40" font-weight="700">SN7408</text>
    <rect x="40" y="86" width="430" height="28" fill="#fde047" opacity="0.75"/>
    <text x="44" y="107" font-size="19" font-weight="700" letter-spacing="0.5">QUADRUPLE 2-INPUT POSITIVE-AND GATES</text>
    <text x="44" y="140" font-size="14" fill="#555">14-PIN PACKAGE · TOP VIEW</text>
  </g>

  <!-- pins: top row 14..8, bottom row 1..7 -->
  <g fill="#9aa0a6">
    <rect x="142" y="194" width="16" height="26"/><rect x="192" y="194" width="16" height="26"/><rect x="242" y="194" width="16" height="26"/>
    <rect x="292" y="194" width="16" height="26"/><rect x="342" y="194" width="16" height="26"/><rect x="392" y="194" width="16" height="26"/>
    <rect x="442" y="194" width="16" height="26"/>
    <rect x="142" y="480" width="16" height="26"/><rect x="192" y="480" width="16" height="26"/><rect x="242" y="480" width="16" height="26"/>
    <rect x="292" y="480" width="16" height="26"/><rect x="342" y="480" width="16" height="26"/><rect x="392" y="480" width="16" height="26"/>
    <rect x="442" y="480" width="16" height="26"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#1f2328">
    <text x="150" y="186">14</text><text x="200" y="186">13</text><text x="250" y="186">12</text><text x="300" y="186">11</text>
    <text x="350" y="186">10</text><text x="400" y="186">9</text><text x="450" y="186">8</text>
    <text x="150" y="524">1</text><text x="200" y="524">2</text><text x="250" y="524">3</text><text x="300" y="524">4</text>
    <text x="350" y="524">5</text><text x="400" y="524">6</text><text x="450" y="524">7</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    <text x="150" y="166">VCC</text><text x="200" y="166">4B</text><text x="250" y="166">4A</text><text x="300" y="166">4Y</text>
    <text x="350" y="166">3B</text><text x="400" y="166">3A</text><text x="450" y="166">3Y</text>
    <text x="150" y="542">1A</text><text x="200" y="542">1B</text><text x="250" y="542">1Y</text><text x="300" y="542">2A</text>
    <text x="350" y="542">2B</text><text x="400" y="542">2Y</text><text x="450" y="542">GND</text>
  </g>

  <!-- the package -->
  <rect x="120" y="220" width="360" height="260" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
  <path d="M120 330 A20 20 0 0 1 120 370" fill="#fbfaf6" stroke="#1f2328" stroke-width="3"/>

  <!-- the four AND doors and their wiring -->
  <g fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round">
    <!-- gate 4: pins 13, 12 in, 11 out -->
    <path d="M200 220 V245 M250 220 V245"/>
    <path d="M195 245 H255 V265 A30 30 0 0 1 195 265 Z" fill="#fff7cc"/>
    <path d="M225 295 V320 H300 V220"/>
    <!-- gate 3: pins 10, 9 in, 8 out -->
    <path d="M350 220 V245 M400 220 V245"/>
    <path d="M345 245 H405 V265 A30 30 0 0 1 345 265 Z" fill="#fff7cc"/>
    <path d="M375 295 V320 H450 V220"/>
    <!-- gate 1: pins 1, 2 in, 3 out -->
    <path d="M150 480 V455 M200 480 V455"/>
    <path d="M145 455 H205 V435 A30 30 0 0 0 145 435 Z" fill="#fff7cc"/>
    <path d="M175 405 V380 H250 V480"/>
    <!-- gate 2: pins 4, 5 in, 6 out -->
    <path d="M300 480 V455 M350 480 V455"/>
    <path d="M295 455 H355 V435 A30 30 0 0 0 295 435 Z" fill="#fff7cc"/>
    <path d="M325 405 V380 H400 V480"/>
    <!-- power -->
    <path d="M150 220 V236 M140 236 H160"/>
    <path d="M450 480 V466 M440 466 H460"/>
  </g>

  <!-- the function table -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2328">
    <text x="44" y="590" font-size="16" font-weight="700">FUNCTION TABLE (each gate)</text>
    <g font-size="16" text-anchor="middle">
      <rect x="44" y="604" width="240" height="30" fill="#efece3"/>
      <text x="84" y="625" font-weight="700">A</text><text x="164" y="625" font-weight="700">B</text><text x="244" y="625" font-weight="700">Y</text>
      <text x="84" y="655">H</text><text x="164" y="655">H</text><text x="244" y="655" font-weight="700">H</text>
      <text x="84" y="679">L</text><text x="164" y="679">X</text><text x="244" y="679">L</text>
      <text x="84" y="703">X</text><text x="164" y="703">L</text><text x="244" y="703">L</text>
    </g>
    <text x="320" y="625" font-size="13" fill="#666">H = high (on) · L = low (off)</text>
    <text x="320" y="645" font-size="13" fill="#666">X = doesn't matter</text>
  </g>
</svg>
